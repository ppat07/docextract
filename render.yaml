services:
  - type: web
    name: docextract
    runtime: docker
    plan: standard
    healthCheckPath: /health
    disk:
      name: docextract-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DOCEXTRACT_API_KEYS
        sync: false
